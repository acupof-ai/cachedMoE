<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>deepMoE 对话</title>
<style>
:root{
  --bg:#fbfbfa; --fg:#1b1b19; --dim:#6b6b66; --line:#e2e0da;
  --card:#ffffff; --user:#eef3fb; --code:#f4f3ef; --accent:#2f6fd0;
  --warn:#b4560a; --bad:#c03030; --ok:#2f7d4f;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#17171a; --fg:#e8e6e1; --dim:#9a988f; --line:#32323a;
         --card:#1f1f24; --user:#22303f; --code:#26262c; --accent:#7fb0ff;
         --warn:#e0954a; --bad:#e56b6b; --ok:#6cc48d; }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.65 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  display:flex;flex-direction:column}
header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  padding:8px 14px;border-bottom:1px solid var(--line);background:var(--card)}
header b{font-size:15px;letter-spacing:.5px}
label{color:var(--dim);font-size:12px}
input,select,button,textarea{font:inherit;color:var(--fg);background:var(--card);
  border:1px solid var(--line);border-radius:6px;padding:4px 7px}
input[type=number]{width:74px}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent);padding:7px 18px}
button.primary:disabled{opacity:.45;cursor:default}
button.stop{color:var(--bad);border-color:var(--bad)}
#bar{display:flex;gap:14px;flex-wrap:wrap;padding:5px 14px;font-size:12px;
  color:var(--dim);border-bottom:1px solid var(--line);background:var(--card)}
#bar span b{color:var(--fg);font-weight:600}
#log{flex:1;overflow-y:auto;padding:16px 14px 24px}
.msg{max-width:860px;margin:0 auto 14px;padding:10px 14px;border-radius:10px;
  background:var(--card);border:1px solid var(--line);overflow-wrap:anywhere}
.msg.user{background:var(--user)}
.who{font-size:11px;color:var(--dim);margin-bottom:4px}
.body{white-space:normal;line-height:1.5}
.body p{margin:0 0 8px}
.body h1,.body h2,.body h3,.body h4,.body h5,.body h6{margin:12px 0 6px;line-height:1.3;font-weight:600}
.body h1{font-size:1.35em}.body h2{font-size:1.2em}.body h3{font-size:1.08em}.body h4,.body h5,.body h6{font-size:1em}
.body ul,.body ol{margin:4px 0 8px;padding-left:22px}
.body li{margin:2px 0}
.body blockquote{margin:4px 0 8px;padding-left:9px;border-left:2px solid var(--line);color:var(--dim)}
.body hr{border:0;border-top:1px solid var(--line);margin:10px 0}
.body table{border-collapse:collapse;margin:6px 0 10px;font-size:0.95em}
.body th,.body td{border:1px solid var(--line);padding:3px 8px;text-align:left}
.body th{background:var(--code)}
.body pre{white-space:pre-wrap}
.body a{color:inherit;text-decoration:underline}
.body pre{background:var(--code);padding:9px 11px;border-radius:7px;overflow-x:auto;
  white-space:pre;margin:7px 0}
.body code{background:var(--code);padding:1px 4px;border-radius:4px}
.think{color:var(--dim);border-left:2px solid var(--line);padding-left:9px;margin-bottom:6px}
.stat{max-width:860px;margin:-8px auto 14px;font-size:11px;color:var(--dim);
  font-family:ui-monospace,Consolas,monospace}
.note{max-width:860px;margin:0 auto 12px;font-size:12px;color:var(--warn);text-align:center}
.note.bad{color:var(--bad)}
.tok[data-p]{border-radius:2px}
.tok[data-p]:hover{background:var(--user);outline:1px solid var(--accent)}
footer{border-top:1px solid var(--line);background:var(--card);padding:9px 14px}
#wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:7px}
#box{width:100%;min-height:78px;max-height:38vh;resize:vertical;line-height:1.5;
  font-family:inherit;padding:9px 11px}
#row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
#count{font-size:12px;color:var(--dim);flex:1;min-width:200px}
#count.warn{color:var(--warn)}
#count.bad{color:var(--bad)}
#prog{height:3px;background:var(--line);border-radius:2px;overflow:hidden;display:none}
#prog>i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
@media (max-width:640px){ header,#bar,#log,footer{padding-left:10px;padding-right:10px} }
</style>
</head>
<body>

<header>
  <b>deepMoE</b>
  <label>会话 <input id="sess" size="10" value="web"></label>
  <label>温度 <input id="temp" type="number" step="0.05" min="0" max="2" value="1.0"></label>
  <label>top_p <input id="topp" type="number" step="0.01" min="0" max="1" value="0.95"></label>
  <label>最长 <input id="maxtok" type="number" min="1" max="8192" value="1024"></label>
  <label>种子 <input id="seed" size="6" placeholder="随机"></label>
  <label><input id="think" type="checkbox"> 思考</label>
  <label><input id="hover" type="checkbox"> 逐 token 概率</label>
  <button id="newconv">新对话</button>
</header>

<div id="bar">
  <span>上下文 <b id="s_ctx">–</b></span>
  <span>速度 <b id="s_tps">–</b></span>
  <span>命中 <b id="s_hit">–</b></span>
  <span>盘等待 <b id="s_stall">–</b></span>
  <span>首字 <b id="s_ttft">–</b></span>
  <span>预填充 <b id="s_pf">–</b></span>
  <span id="s_q"></span>
</div>

<div id="log"></div>

<footer>
  <div id="wrap">
    <div id="prog"><i></i></div>
    <textarea id="box" placeholder="输入消息，或粘贴长文档（Ctrl+Enter 发送）"></textarea>
    <div id="row">
      <span id="count">0 字符</span>
      <button id="stop" class="stop" hidden>停止</button>
      <button id="send" class="primary">发送</button>
    </div>
  </div>
</footer>

<script>
"use strict";
const $ = id => document.getElementById(id);
const log = $("log");
let CFG = null, running = false, abort = null;

// ---------- markdown-lite: fenced code, inline code, line breaks ----------
function esc(s){ return s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
// Inline: code, bold, italic, links. Input is already escaped.
function inline(t){
  return t
    .replace(/`([^`\n]+)`/g, (m,c) => "<code>" + c + "</code>")
    .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, "$1<i>$2</i>")
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
// Block: headings, lists, tables, quotes, rules, paragraphs. Streaming-safe:
// it is re-run on the whole text at every token, so a half-typed line just
// renders as a paragraph until it completes.
function blocks(text){
  const lines = esc(text).split("\n");
  let out = "", para = [], list = null, table = null;
  const flushP = () => { if (para.length){ out += "<p>" + para.map(inline).join("<br>") + "</p>"; para = []; } };
  const flushL = () => { if (list){ out += "</" + list + ">"; list = null; } };
  const flushT = () => {
    if (!table) return;
    const rows = table.filter(r => !/^\s*\|?\s*:?-{2,}/.test(r));
    out += "<table>" + rows.map((r, i) => {
      const cells = r.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map(c => inline(c.trim()));
      const tag = i === 0 ? "th" : "td";
      return "<tr>" + cells.map(c => "<" + tag + ">" + c + "</" + tag + ">").join("") + "</tr>";
    }).join("") + "</table>";
    table = null;
  };
  for (const raw of lines){
    const l = raw.replace(/\s+$/, "");
    let m;
    if (/^\s*\|.*\|\s*$/.test(l)){ flushP(); flushL(); (table = table || []).push(l); continue; }
    flushT();
    if (!l.trim()){ flushP(); flushL(); continue; }
    if ((m = l.match(/^(#{1,6})\s+(.*)$/))){ flushP(); flushL(); out += "<h" + m[1].length + ">" + inline(m[2]) + "</h" + m[1].length + ">"; continue; }
    if (/^\s*([-*_])\s*\1\s*\1[\s\1]*$/.test(l)){ flushP(); flushL(); out += "<hr>"; continue; }
    if ((m = l.match(/^\s*&gt;\s?(.*)$/))){ flushP(); flushL(); out += "<blockquote>" + inline(m[1]) + "</blockquote>"; continue; }
    if ((m = l.match(/^\s*[-*+]\s+(.*)$/))){ flushP(); if (list !== "ul"){ flushL(); out += "<ul>"; list = "ul"; } out += "<li>" + inline(m[1]) + "</li>"; continue; }
    if ((m = l.match(/^\s*\d+[.)]\s+(.*)$/))){ flushP(); if (list !== "ol"){ flushL(); out += "<ol>"; list = "ol"; } out += "<li>" + inline(m[1]) + "</li>"; continue; }
    flushL(); para.push(l);
  }
  flushP(); flushL(); flushT();
  return out;
}
function md(s){
  const parts = String(s).split("```");
  let out = "";
  for (let i = 0; i < parts.length; i++){
    if (i % 2){
      let b = parts[i];
      const nl = b.indexOf("\n");
      if (nl >= 0 && !/\s/.test(b.slice(0, nl))) b = b.slice(nl + 1);
      out += "<pre>" + esc(b.replace(/\n$/, "")) + "</pre>";
    } else {
      out += blocks(parts[i]);
    }
  }
  return out;
}

function bubble(who, cls){
  const d = document.createElement("div");
  d.className = "msg " + (cls || "");
  d.innerHTML = '<div class="who">' + who + '</div><div class="body"></div>';
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d.querySelector(".body");
}
function note(text, bad){
  const d = document.createElement("div");
  d.className = "note" + (bad ? " bad" : "");
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}
function statline(text){
  const d = document.createElement("div");
  d.className = "stat";
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}
const atBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 90;

function hms(s){
  if (!isFinite(s) || s < 0) return "–";
  if (s < 90) return s.toFixed(0) + " 秒";
  if (s < 5400) return (s/60).toFixed(1) + " 分";
  return (s/3600).toFixed(1) + " 小时";
}

// ---------- config ----------
async function loadConfig(){
  CFG = await (await fetch("/api/config")).json();
  $("s_ctx").textContent = "0 / " + CFG.max_context.toLocaleString();
  note("引擎就绪：max_context " + CFG.max_context.toLocaleString()
     + "，硬上限 " + CFG.ceiling.toLocaleString() + " token");
  refreshStatus();
}

async function refreshStatus(){
  try{
    const s = await (await fetch("/api/status?session=" + encodeURIComponent($("sess").value))).json();
    if (s.context !== undefined)
      $("s_ctx").textContent = s.context.toLocaleString() + " / " + s.max_context.toLocaleString();
    $("s_pf").textContent = (s.prefill_ms_per_token||0).toFixed(1) + " ms/tok";
    $("s_q").textContent = s.queue > 1 ? ("队列 " + (s.queue - 1)) : "";
  }catch(e){}
}

// ---------- token count for the draft ----------
let previewTimer = null, lastPreview = null;
function schedulePreview(){
  const n = $("box").value.length;
  $("count").className = "";
  $("count").textContent = n.toLocaleString() + " 字符 · 统计中…";
  clearTimeout(previewTimer);
  previewTimer = setTimeout(preview, n > 200000 ? 900 : 350);
}
async function preview(){
  const text = $("box").value;
  if (!text.trim()){ $("count").textContent = "0 字符"; $("count").className=""; lastPreview=null; return; }
  try{
    const r = await fetch("/api/preview", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({session:$("sess").value, text, think:$("think").checked})});
    const p = await r.json();
    const el = $("count");
    if (p.pending){     // serve is mid-turn; it cannot tokenize until the turn ends
      lastPreview = null;
      el.className = "";
      el.textContent = text.length.toLocaleString() + " 字符 · " + p.message;
      return;
    }
    lastPreview = p;
    let s = text.length.toLocaleString() + " 字符 · 提示词 " + p.prompt_tokens.toLocaleString()
          + " token（复用 " + p.reused.toLocaleString() + "，需预填充 " + p.to_prefill.toLocaleString() + "）";
    s += " · 预计 " + hms(p.eta_s) + "（" + p.ms_per_token.toFixed(1) + " ms/token）";
    el.className = p.over ? "bad" : (p.to_prefill >= 20000 ? "warn" : "");
    if (p.over) s = p.message + "，请缩短或重启时调大 --max-context（硬上限 "
                    + p.ceiling.toLocaleString() + "）";
    el.textContent = s;
    $("send").disabled = p.over || running;
  }catch(e){ $("count").textContent = "统计失败：" + e; }
}

// ---------- history: the server keeps the transcript per session, so a reload
// (or a restarted server.py) shows the same conversation the engine's KV holds.
async function loadHistory(){
  log.innerHTML = "";
  try{
    const r = await fetch("/api/history?session=" + encodeURIComponent($("sess").value));
    const h = await r.json();
    const msgs = h.messages || [];
    for (const m of msgs){
      if (m.role === "user"){
        const ub = bubble("我", "user");
        const t = m.content || "";
        ub.textContent = t.length > 4000 ? t.slice(0, 4000) + "\n… （共 " + t.length.toLocaleString() + " 字符）" : t;
      } else if (m.role === "assistant"){
        const body = bubble("deepMoE");
        const r0 = (m.reasoning_content || "").trim();
        body.innerHTML = (r0 ? '<div class="think">' + md(r0) + "</div>" : "") + md(m.content || "");
        const s = m.stat;
        if (s) statline("TTFT " + ((s.ttft_ms||0)/1000).toFixed(1) + " s | 预填充 " + (s.prefill_tokens ?? "–")
          + " tok (" + (s.prefill_mode || "–") + "，复用 " + (s.reused ?? "–") + ") | 解码 " + (s.generated ?? "–")
          + " tok " + (s.tok_s||0).toFixed(2) + " tok/s 命中 " + (s.hit||0).toFixed(3)
          + " | 盘等待 " + (s.stall||0).toFixed(0) + " ms/tok | " + (s.finish || "–") + " | ctx " + (s.context ?? "–"));
      }
    }
    if (msgs.length) note("已恢复 " + msgs.filter(m => m.role === "user").length + " 轮对话（引擎里的上下文仍在）");
    if (typeof h.think === "boolean") $("think").checked = h.think;
  }catch(e){ note("历史读取失败：" + e, true); }
  log.scrollTop = log.scrollHeight;
}

// ---------- send ----------
async function send(){
  if (running) return;
  const text = $("box").value;
  if (!text.trim()) return;
  if (lastPreview && lastPreview.over) return;
  if (lastPreview && lastPreview.to_prefill >= 20000 &&
      !confirm("需要预填充 " + lastPreview.to_prefill.toLocaleString()
             + " token，预计 " + hms(lastPreview.eta_s) + "。继续？")) return;

  running = true; $("send").disabled = true; $("stop").hidden = false;
  $("box").value = ""; $("count").textContent = "0 字符"; $("count").className = ""; lastPreview = null;

  const ub = bubble("我", "user");
  ub.textContent = text.length > 4000 ? text.slice(0, 4000) + "\n… （共 " + text.length.toLocaleString() + " 字符）" : text;

  let noteEl = null, body = null, raw = "", t0 = performance.now(), first = null;
  const prog = $("prog"), bar = prog.firstElementChild;
  const perTok = $("hover").checked;

  abort = new AbortController();
  try{
    const res = await fetch("/api/chat", {method:"POST", signal:abort.signal,
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({session:$("sess").value, text,
        temperature:parseFloat($("temp").value), top_p:parseFloat($("topp").value),
        max_tokens:parseInt($("maxtok").value,10), seed:$("seed").value || null,
        think:$("think").checked})});
    const rd = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for(;;){
      const {value, done} = await rd.read();
      if (done) break;
      buf += dec.decode(value, {stream:true});
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0){
        const frame = buf.slice(0, i); buf = buf.slice(i + 2);
        if (!frame.startsWith("data:")) continue;
        const ev = JSON.parse(frame.slice(5).trim());
        const stick = atBottom();

        if (ev.event === "queued"){
          if (!noteEl) noteEl = note("");
          noteEl.textContent = "排队中：前面还有 " + ev.position + " 个请求";
          $("s_q").textContent = "队列 " + ev.position;
        }
        else if (ev.event === "start"){
          if (!noteEl) noteEl = note("");
          noteEl.textContent = "提示词 " + ev.prompt_tokens.toLocaleString() + " token，复用 "
            + ev.reused.toLocaleString() + "，预填充 " + ev.to_prefill.toLocaleString()
            + " token，预计 " + hms(ev.eta_s);
          if (ev.to_prefill > 64){ prog.style.display = "block"; bar.style.width = "0%"; }
        }
        else if (ev.event === "prefill"){
          prog.style.display = "block";
          bar.style.width = (100 * ev.done / Math.max(1, ev.total)).toFixed(1) + "%";
          if (noteEl) noteEl.textContent = "预填充 " + ev.done.toLocaleString() + " / "
            + ev.total.toLocaleString() + " token · 剩余约 " + hms(ev.eta_s)
            + "（" + ev.ms_per_token.toFixed(1) + " ms/token）";
          $("s_pf").textContent = ev.ms_per_token.toFixed(1) + " ms/tok";
        }
        else if (ev.event === "token"){
          if (!body){
            prog.style.display = "none";
            if (noteEl){ noteEl.remove(); noteEl = null; }
            body = bubble("deepMoE");
            first = performance.now() - t0;
            $("s_ttft").textContent = (first/1000).toFixed(1) + " s";
          }
          raw += ev.text;
          if (perTok){
            const sp = document.createElement("span");
            sp.className = "tok"; sp.dataset.p = "1";
            sp.textContent = ev.text;
            sp.title = "p=" + ev.p.toFixed(3) + "  hit=" + ev.hit.toFixed(3)
                     + "  step=" + ev.step_ms.toFixed(0) + " ms  id=" + ev.id;
            body.appendChild(sp);
          } else {
            body.innerHTML = md(raw);
          }
          $("s_tps").textContent = (1000/Math.max(1, ev.step_ms)).toFixed(2) + " tok/s";
          $("s_hit").textContent = ev.hit.toFixed(3);
        }
        else if (ev.event === "done"){
          prog.style.display = "none";
          if (noteEl){ noteEl.remove(); noteEl = null; }
          if (ev.queued_drop){ note("已取消（未开始）"); break; }
          if (!body) body = bubble("deepMoE");
          // A completion the official parser puts nowhere (no content, no
          // reasoning) still has to be shown: fall back to the raw stream.
          const hasR = !!(ev.reasoning && ev.reasoning.trim());
          const hasC = !!(ev.content && ev.content.trim());
          body.innerHTML = hasR ? '<div class="think">' + md(ev.reasoning.trim()) + "</div>" : "";
          body.innerHTML += md(hasC ? ev.content : (hasR ? "" : raw));
          const pt = ev.per_token_ms || {};
          $("s_tps").textContent = (ev.tok_s||0).toFixed(2) + " tok/s";
          $("s_hit").textContent = (ev.decode_hit_rate||0).toFixed(3);
          $("s_stall").textContent = (pt.nvme_stall||0).toFixed(0) + " ms";
          $("s_ttft").textContent = ((ev.ttft_ms||0)/1000).toFixed(1) + " s";
          $("s_ctx").textContent = (ev.context||0).toLocaleString() + " / " + CFG.max_context.toLocaleString();
          statline("TTFT " + ((ev.ttft_ms||0)/1000).toFixed(1) + " s | 预填充 "
            + ev.prefill_tokens + " tok (" + ev.prefill_mode + "，复用 " + ev.reused_tokens + ") "
            + (ev.prefill_tok_s||0).toFixed(2) + " tok/s | 解码 " + ev.generated + " tok "
            + (ev.tok_s||0).toFixed(2) + " tok/s 命中 " + (ev.decode_hit_rate||0).toFixed(3)
            + " | 盘等待 " + (pt.nvme_stall||0).toFixed(0) + " ms/tok | " + ev.finish
            + " | ctx " + ev.context + " | seed " + ev.seed);
        }
        else if (ev.event === "error"){
          prog.style.display = "none";
          if (noteEl){ noteEl.remove(); noteEl = null; }
          note("错误：" + ev.message, true);
        }
        if (stick) log.scrollTop = log.scrollHeight;
      }
    }
  }catch(e){
    if (e.name !== "AbortError") note("连接错误：" + e, true);
  }finally{
    running = false; abort = null;
    $("send").disabled = false; $("stop").hidden = true;
    $("prog").style.display = "none"; $("s_q").textContent = "";
    refreshStatus();
    if ($("box").value.trim()) schedulePreview();   // a draft typed during the turn
  }
}

// ---------- controls ----------
$("send").onclick = send;
$("stop").onclick = async () => {
  await fetch("/api/cancel", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({session:$("sess").value})});
};
$("newconv").onclick = async () => {
  await fetch("/api/reset", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({session:$("sess").value})});
  log.innerHTML = "";
  note("已清空上下文（专家缓存保持热）");
  refreshStatus();
};
$("box").addEventListener("input", schedulePreview);
$("box").addEventListener("paste", () => setTimeout(schedulePreview, 0));
$("box").addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); send(); }
});
$("sess").addEventListener("change", () => { loadHistory(); refreshStatus(); lastPreview = null; schedulePreview(); });
$("think").addEventListener("change", schedulePreview);
setInterval(() => { if (!running) refreshStatus(); }, 5000);
loadConfig();
loadHistory();
</script>
</body>
</html>
