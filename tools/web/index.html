<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>deepMoE — Local chat</title>
<style>
:root{
  --bg:#fbfbfa; --fg:#1b1b19; --dim:#6b6b66; --line:#e2e0da;
  --card:#ffffff; --user:#eef3fb; --code:#f4f3ef; --accent:#2f6fd0;
  --warn:#b4560a; --bad:#c03030; --ok:#2f7d4f;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#17171a; --fg:#e8e6e1; --dim:#9a988f; --line:#32323a;
         --card:#1f1f24; --user:#22303f; --code:#26262c; --accent:#7fb0ff;
         --warn:#e0954a; --bad:#e56b6b; --ok:#6cc48d; }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);
  font:14px/1.65 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  display:flex;flex-direction:column}
header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  padding:8px 14px;border-bottom:1px solid var(--line);background:var(--card)}
header b{font-size:15px;letter-spacing:.5px}
label{color:var(--dim);font-size:12px}
input,select,button,textarea{font:inherit;color:var(--fg);background:var(--card);
  border:1px solid var(--line);border-radius:6px;padding:4px 7px}
input[type=number]{width:74px}
button{cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent);padding:7px 18px}
button.primary:disabled{opacity:.45;cursor:default}
button.stop{color:var(--bad);border-color:var(--bad)}
#bar{display:flex;gap:14px;flex-wrap:wrap;padding:5px 14px;font-size:12px;
  color:var(--dim);border-bottom:1px solid var(--line);background:var(--card)}
#bar span b{color:var(--fg);font-weight:600}
#gpu{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:4px 14px;
  font-size:12px;color:var(--dim);border-bottom:1px solid var(--line);background:var(--card)}
#gpu span b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
#gpu b.busy{color:var(--accent)}
#gpu b.disk{color:var(--warn)}
#spark{flex:1;min-width:160px;height:34px}
#log{flex:1;overflow-y:auto;padding:16px 14px 24px}
.msg{max-width:860px;margin:0 auto 14px;padding:10px 14px;border-radius:10px;
  background:var(--card);border:1px solid var(--line);overflow-wrap:anywhere}
.msg.user{background:var(--user)}
.who{font-size:11px;color:var(--dim);margin-bottom:4px}
.body{white-space:normal;line-height:1.5}
.body p{margin:0 0 8px}
.body h1,.body h2,.body h3,.body h4,.body h5,.body h6{margin:12px 0 6px;line-height:1.3;font-weight:600}
.body h1{font-size:1.35em}.body h2{font-size:1.2em}.body h3{font-size:1.08em}.body h4,.body h5,.body h6{font-size:1em}
.body ul,.body ol{margin:4px 0 8px;padding-left:22px}
.body li{margin:2px 0}
.body blockquote{margin:4px 0 8px;padding-left:9px;border-left:2px solid var(--line);color:var(--dim)}
.body hr{border:0;border-top:1px solid var(--line);margin:10px 0}
.body table{border-collapse:collapse;margin:6px 0 10px;font-size:0.95em}
.body th,.body td{border:1px solid var(--line);padding:3px 8px;text-align:left}
.body th{background:var(--code)}
.body pre{white-space:pre-wrap}
.body a{color:inherit;text-decoration:underline}
.body pre{background:var(--code);padding:9px 11px;border-radius:7px;overflow-x:auto;
  white-space:pre;margin:7px 0}
.body code{background:var(--code);padding:1px 4px;border-radius:4px}
.thinking{background:var(--code);border:1px solid var(--line);border-radius:8px;margin:8px 0 12px}
.thinking summary{cursor:pointer;color:var(--dim);padding:8px 11px;font-size:12px;user-select:none}
.thinking .reasoning{border-top:1px solid var(--line);padding:10px 12px;color:var(--dim);max-height:300px;overflow-y:auto}
.answer-label{color:var(--accent);font-size:11px;font-weight:600;margin-bottom:5px}
[hidden]{display:none!important}
.stat{max-width:860px;margin:-8px auto 14px;font-size:11px;color:var(--dim);
  font-family:ui-monospace,Consolas,monospace}
.note{max-width:860px;margin:0 auto 12px;font-size:12px;color:var(--warn);text-align:center}
.note.bad{color:var(--bad)}
.tok[data-p]{border-radius:2px}
.tok[data-p]:hover{background:var(--user);outline:1px solid var(--accent)}
footer{border-top:1px solid var(--line);background:var(--card);padding:9px 14px}
#wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:7px}
#box{width:100%;min-height:78px;max-height:38vh;resize:vertical;line-height:1.5;
  font-family:inherit;padding:9px 11px}
#row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
#count{font-size:12px;color:var(--dim);flex:1;min-width:200px}
#count.warn{color:var(--warn)}
#count.bad{color:var(--bad)}
#prog{height:3px;background:var(--line);border-radius:2px;overflow:hidden;display:none}
#prog>i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
@media (max-width:640px){ header,#bar,#log,footer{padding-left:10px;padding-right:10px} }
</style>
</head>
<body>

<header>
  <b>deepMoE</b>
  <label>Session <input id="sess" size="10" value="web"></label>
  <label>Temperature <input id="temp" type="number" step="0.05" min="0" max="2" value="1.0"></label>
  <label>top_p <input id="topp" type="number" step="0.01" min="0" max="1" value="0.95"></label>
  <label>Max tokens <input id="maxtok" type="number" min="1" max="8192" value="1024"></label>
  <label>Seed <input id="seed" size="6" placeholder="Random"></label>
  <label>Decode <select id="decode_mode" disabled>
    <option value="">Engine default</option>
  </select></label>
  <small>Applies to new computation. Start a new chat for an exact history.</small>
  <label><input id="think" type="checkbox"> Thinking</label>
  <label>effort <select id="effort" disabled>
    <option value="50">Low · 50</option><option value="75" selected>High · 75</option>
    <option value="100">Max · 100</option><option value="custom">Custom</option>
  </select></label>
  <label id="effort_custom_label" hidden>Budget <input id="effort_custom" type="number"
    min="1" max="100" step="1" value="75" size="3" disabled></label>
  <label><input id="hover" type="checkbox"> Token probabilities</label>
  <button id="newconv">New chat</button>
</header>

<div id="bar">
  <span>Context <b id="s_ctx">–</b></span>
  <span>Speed <b id="s_tps">–</b></span>
  <span>Hit rate <b id="s_hit">–</b></span>
  <span>Disk wait <b id="s_stall">–</b></span>
  <span>First token <b id="s_ttft">–</b></span>
  <span>Prefill <b id="s_pf">–</b></span>
  <span>Resident DSpark <b id="s_spec">–</b></span>
  <span>Last turn <b id="s_mode">–</b></span>
  <span id="s_q"></span>
</div>

<div id="gpu" hidden>
  <canvas id="spark"></canvas>
  <span>GPU <b id="g_busy" class="busy">–</b></span>
  <span>Clock <b id="g_clk">–</b></span>
  <span>Disk read <b id="g_disk" class="disk">–</b></span>
  <span>GTT <b id="g_gtt">–</b></span>
  <span>Temperature <b id="g_temp">–</b></span>
  <span>Power <b id="g_pow">–</b></span>
</div>

<div id="log"></div>

<footer>
  <div id="wrap">
    <div id="prog"><i></i></div>
    <textarea id="box" placeholder="Write a message or paste a document (Ctrl+Enter to send)"></textarea>
    <div id="row">
      <span id="count">0 characters</span>
      <button id="stop" class="stop" hidden>Stop</button>
      <button id="send" class="primary">Send</button>
    </div>
  </div>
</footer>

<script>
"use strict";
const $ = id => document.getElementById(id);
const log = $("log");
let CFG = null, running = false, abort = null;

// ---------- markdown-lite: fenced code, inline code, line breaks ----------
function esc(s){ return s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }
// Inline: code, bold, italic, links. Input is already escaped.
function inline(t){
  return t
    .replace(/`([^`\n]+)`/g, (m,c) => "<code>" + c + "</code>")
    .replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, "$1<i>$2</i>")
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
// Block: headings, lists, tables, quotes, rules, paragraphs. Streaming-safe:
// it is re-run on the whole text at every token, so a half-typed line just
// renders as a paragraph until it completes.
function blocks(text){
  const lines = esc(text).split("\n");
  let out = "", para = [], list = null, table = null;
  const flushP = () => { if (para.length){ out += "<p>" + para.map(inline).join("<br>") + "</p>"; para = []; } };
  const flushL = () => { if (list){ out += "</" + list + ">"; list = null; } };
  const flushT = () => {
    if (!table) return;
    const rows = table.filter(r => !/^\s*\|?\s*:?-{2,}/.test(r));
    out += "<table>" + rows.map((r, i) => {
      const cells = r.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map(c => inline(c.trim()));
      const tag = i === 0 ? "th" : "td";
      return "<tr>" + cells.map(c => "<" + tag + ">" + c + "</" + tag + ">").join("") + "</tr>";
    }).join("") + "</table>";
    table = null;
  };
  for (const raw of lines){
    const l = raw.replace(/\s+$/, "");
    let m;
    if (/^\s*\|.*\|\s*$/.test(l)){ flushP(); flushL(); (table = table || []).push(l); continue; }
    flushT();
    if (!l.trim()){ flushP(); flushL(); continue; }
    if ((m = l.match(/^(#{1,6})\s+(.*)$/))){ flushP(); flushL(); out += "<h" + m[1].length + ">" + inline(m[2]) + "</h" + m[1].length + ">"; continue; }
    if (/^\s*([-*_])\s*\1\s*\1[\s\1]*$/.test(l)){ flushP(); flushL(); out += "<hr>"; continue; }
    if ((m = l.match(/^\s*&gt;\s?(.*)$/))){ flushP(); flushL(); out += "<blockquote>" + inline(m[1]) + "</blockquote>"; continue; }
    if ((m = l.match(/^\s*[-*+]\s+(.*)$/))){ flushP(); if (list !== "ul"){ flushL(); out += "<ul>"; list = "ul"; } out += "<li>" + inline(m[1]) + "</li>"; continue; }
    if ((m = l.match(/^\s*\d+[.)]\s+(.*)$/))){ flushP(); if (list !== "ol"){ flushL(); out += "<ol>"; list = "ol"; } out += "<li>" + inline(m[1]) + "</li>"; continue; }
    flushL(); para.push(l);
  }
  flushP(); flushL(); flushT();
  return out;
}
function md(s){
  const parts = String(s).split("```");
  let out = "";
  for (let i = 0; i < parts.length; i++){
    if (i % 2){
      let b = parts[i];
      const nl = b.indexOf("\n");
      if (nl >= 0 && !/\s/.test(b.slice(0, nl))) b = b.slice(nl + 1);
      out += "<pre>" + esc(b.replace(/\n$/, "")) + "</pre>";
    } else {
      out += blocks(parts[i]);
    }
  }
  return out;
}

// ---------- response channels (also exercised by test_ui.cjs) ----------
class ResponseChannels {
  constructor(thinking){
    this.channel = thinking ? "reasoning" : "answer";
    this.opening = thinking;
    this.pending = [];
    this.reasoning = "";
    this.answer = "";
  }
  take(n, emit, out){
    while(n && this.pending.length){
      const part = this.pending[0], k = Math.min(n, part.text.length);
      const text = part.text.slice(0, k);
      if(emit){
        this[this.channel] += text;
        out.push({channel:this.channel, text, meta:part.meta});
      }
      part.text = part.text.slice(k); n -= k;
      if(!part.text) this.pending.shift();
    }
  }
  push(text, meta={}, flush=false){
    if(text) this.pending.push({text, meta});
    const out = [];
    const eos = "<｜end▁of▁sentence｜>";
    for(;;){
      const rest = this.pending.map(p => p.text).join("");
      if(!rest) break;
      // The prompt already contains <think>; tolerate an optional echoed opener.
      if(this.opening){
        if(rest.startsWith("<think>")) this.take(7, false, out);
        else if("<think>".startsWith(rest) && !flush) break;
        this.opening = false;
        continue;
      }
      const tags = this.channel === "reasoning" ? ["</think>", eos] : [eos];
      let pos = rest.length, found = null;
      for(const tag of tags){
        const i = rest.indexOf(tag);
        if(i >= 0 && i < pos){pos = i; found = tag;}
      }
      if(found){
        this.take(pos, true, out);
        this.take(found.length, false, out);
        if(found === "</think>") this.channel = "answer";
        continue;
      }
      let hold = 0;
      if(!flush) for(const tag of tags) for(let k=1;k<tag.length;k++){
        if(rest.endsWith(tag.slice(0,k))) hold = Math.max(hold,k);
      }
      this.take(rest.length-hold, true, out);
      break;
    }
    return out;
  }
}
// ---------- bubbles ----------
function bubble(who, cls){
  const d = document.createElement("div");
  d.className = "msg " + (cls || "");
  d.innerHTML = '<div class="who">' + who + '</div><div class="body"></div>';
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d.querySelector(".body");
}
function assistant(thinking=false, perToken=false){
  const body = bubble("deepMoE");
  body.innerHTML = '<details class="thinking" hidden><summary>Thinking…</summary>'
    + '<div class="body reasoning"></div></details><section class="answer" hidden>'
    + '<div class="answer-label">Answer</div><div class="body answer-content"></div></section>';
  const panel = body.querySelector(".thinking"), summary = panel.querySelector("summary");
  const reasoning = body.querySelector(".reasoning"), section = body.querySelector(".answer");
  const answer = body.querySelector(".answer-content"), channels = new ResponseChannels(thinking);
  panel.open = true;
  let closed = false;
  function close(){if(!closed){panel.open=false; closed=true;}}
  function paint(parts){
    for(const part of parts){
      const target = part.channel === "reasoning" ? reasoning : answer;
      if(perToken){
        const span = document.createElement("span");
        span.className="tok"; span.dataset.p="1"; span.textContent=part.text;
        const m=part.meta;
        span.title = "p=" + Number(m.p||0).toFixed(3) + "  hit=" + Number(m.hit||0).toFixed(3)
          + "  step=" + Number(m.step_ms||0).toFixed(0) + " ms  id=" + (m.id ?? "–");
        target.appendChild(span);
      }else target.innerHTML = md(channels[part.channel]);
    }
    panel.hidden = !channels.reasoning.trim();
    section.hidden = !channels.answer.trim();
    if(!section.hidden){summary.textContent="Thought process";close();}
  }
  return {
    push(text, meta){paint(channels.push(text, meta));},
    finish(r, c){
      paint(channels.push("", {}, true));
      // Keep partial reasoning in its own panel when the turn is cancelled or cut short.
      if((r||"").trim() || (c||"").trim()){
        if(!perToken || r !== channels.reasoning || c !== channels.answer){
          reasoning.innerHTML=md(r||""); answer.innerHTML=md(c||"");
        }
        panel.hidden=!(r||"").trim(); section.hidden=!(c||"").trim();
      }
      summary.textContent="Thought process"; close();
    },
    close
  };
}
function note(text, bad){
  const d = document.createElement("div");
  d.className = "note" + (bad ? " bad" : "");
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d;
}
function statline(text){
  const d = document.createElement("div");
  d.className = "stat";
  d.textContent = text;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}
const atBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 90;

function hms(s){
  if (!isFinite(s) || s < 0) return "–";
  if (s < 90) return s.toFixed(0) + " s";
  if (s < 5400) return (s/60).toFixed(1) + " min";
  return (s/3600).toFixed(1) + " h";
}

// ---------- config ----------
function decodeModeLabel(mode){
  return {"mask-spec":"Mask + speculation", "mask-plain":"Mask · plain",
    "off-plain":"Off · plain"}[mode] || "Engine default";
}
function decodeModeSummary(result){
  const spec = result.speculation_enabled;
  return decodeModeLabel(result.decode_mode) + " / speculation "
    + (spec === true ? "on" : spec === false ? "off" : "unknown");
}
function configureDecodeModes(policy){
  const select = $("decode_mode");
  const available = policy.available || [];
  select.replaceChildren();
  for (const mode of available) select.add(new Option(decodeModeLabel(mode), mode));
  const selectable = available.includes(policy.default);
  if (!selectable) select.add(new Option(decodeModeLabel(policy.default), policy.default || ""));
  select.value = policy.default || "";
  select.disabled = !selectable;
}
async function loadConfig(){
  CFG = await (await fetch("/api/config")).json();
  $("s_ctx").textContent = "0 / " + CFG.max_context.toLocaleString();
  const spec = CFG.ready.speculation || {};
  $("s_spec").textContent = spec.enabled
    ? "k=" + spec.draft_tokens + " / top-K=" + spec.accept_top_k : "Off";
  configureDecodeModes(CFG.decode_modes || {});
  note("Engine ready: max context " + CFG.max_context.toLocaleString()
     + "; capacity limit " + CFG.ceiling.toLocaleString() + " token");
  refreshStatus();
}

async function refreshStatus(){
  try{
    const s = await (await fetch("/api/status?session=" + encodeURIComponent($("sess").value))).json();
    if (s.context !== undefined)
      $("s_ctx").textContent = s.context.toLocaleString() + " / " + s.max_context.toLocaleString();
    $("s_pf").textContent = (s.prefill_ms_per_token||0).toFixed(1) + " ms/tok";
    $("s_q").textContent = s.queue > 1 ? ("Queue " + (s.queue - 1)) : "";
  }catch(e){}
}

// ---------- gpu telemetry strip ----------
// One fetch a second while the tab is visible.  The blue area is
// gpu_busy_percent on a fixed 0-100 scale (the saturation number); the orange
// line is the NVMe read rate scaled to the window's peak -- decode is
// disk-bound, so "GPU low while the line is high" is the expected shape, and
// the clock (600 MHz idle vs boost) tells throttling apart from idleness.
let gpuOff = false;
async function pollGpu(){
  if (gpuOff || document.hidden) return;
  let g;
  try{ g = await (await fetch("/api/gpu")).json(); }catch(e){ return; }
  if (!g.available){ gpuOff = true; return; }
  $("gpu").hidden = false;
  const n = g.now || {};
  $("g_busy").textContent = (n.busy ?? 0) + " %";
  $("g_clk").textContent = (n.mhz || 0) + " MHz";
  $("g_disk").textContent = (n.disk || 0).toFixed(1) + " MB/s";
  $("g_gtt").textContent = ((n.gtt || 0)/2**30).toFixed(1) + " / " + (g.gtt_total/2**30).toFixed(0) + " GiB";
  $("g_temp").textContent = (n.temp || 0) + " °C";
  $("g_pow").textContent = (n.watt || 0).toFixed(0) + " W";
  drawSpark(g.hist);
}
function drawSpark(hist){
  const c = $("spark"), dpr = devicePixelRatio || 1;
  const w = c.clientWidth, h = c.clientHeight;
  if (!w || !hist.length) return;
  if (c.width !== w*dpr || c.height !== h*dpr){ c.width = w*dpr; c.height = h*dpr; }
  const ctx = c.getContext("2d"), css = getComputedStyle(document.body);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  ctx.strokeStyle = css.getPropertyValue("--line"); ctx.lineWidth = 1;
  ctx.strokeRect(.5, .5, w-1, h-1);
  const N = hist.length, x = i => .5 + (w-1) * i / Math.max(1, N-1);
  const accent = css.getPropertyValue("--accent").trim();
  ctx.beginPath(); ctx.moveTo(x(0), h-.5);
  for (let i = 0; i < N; i++) ctx.lineTo(x(i), .5 + (h-1) * (1 - hist[i][0]/100));
  ctx.lineTo(x(N-1), h-.5); ctx.closePath();
  ctx.globalAlpha = .25; ctx.fillStyle = accent; ctx.fill();
  ctx.globalAlpha = 1; ctx.strokeStyle = accent; ctx.lineWidth = 1.2;
  ctx.beginPath();
  for (let i = 0; i < N; i++) ctx[i ? "lineTo" : "moveTo"](x(i), .5 + (h-1) * (1 - hist[i][0]/100));
  ctx.stroke();
  const peak = Math.max(100, ...hist.map(s => s[2]));   // MB/s, >=100 so idle stays flat
  ctx.strokeStyle = css.getPropertyValue("--warn").trim();
  ctx.beginPath();
  for (let i = 0; i < N; i++) ctx[i ? "lineTo" : "moveTo"](x(i), .5 + (h-1) * (1 - hist[i][2]/peak));
  ctx.stroke();
  ctx.fillStyle = css.getPropertyValue("--dim").trim();
  ctx.font = "9px ui-monospace,monospace"; ctx.textAlign = "right";
  ctx.fillText("Disk peak " + peak.toFixed(0) + " MB/s", w-4, 10);
}
setInterval(pollGpu, 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) pollGpu(); });

// ---------- token count for the draft ----------
let previewTimer = null, lastPreview = null;
function schedulePreview(){
  const n = $("box").value.length;
  $("count").className = "";
  $("count").textContent = n.toLocaleString() + " characters · counting…";
  clearTimeout(previewTimer);
  previewTimer = setTimeout(preview, n > 200000 ? 900 : 350);
}
async function preview(){
  const text = $("box").value;
  if (!text.trim()){ $("count").textContent = "0 characters"; $("count").className=""; lastPreview=null; return; }
  try{
    const r = await fetch("/api/preview", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({session:$("sess").value, text, think:$("think").checked,
        reasoning_effort:effortValue()})});
    const p = await r.json();
    if (!r.ok) throw new Error(p.error || "Preview failed");
    const el = $("count");
    if (p.pending){     // serve is mid-turn; it cannot tokenize until the turn ends
      lastPreview = null;
      el.className = "";
      el.textContent = text.length.toLocaleString() + " characters · " + p.message;
      return;
    }
    lastPreview = p;
    let s = text.length.toLocaleString() + " characters · Prompt " + p.prompt_tokens.toLocaleString()
          + " token (reused " + p.reused.toLocaleString() + "; to prefill " + p.to_prefill.toLocaleString() + ")";
    s += " · estimated " + hms(p.eta_s) + " (" + p.ms_per_token.toFixed(1) + " ms/token)";
    el.className = p.over ? "bad" : (p.to_prefill >= 20000 ? "warn" : "");
    if (p.over) s = p.message + ", Shorten the prompt or restart with a larger --max-context (capacity limit "
                    + p.ceiling.toLocaleString() + ")";
    el.textContent = s;
    $("send").disabled = p.over || running;
  }catch(e){ $("count").textContent = "Count failed: " + e; }
}

// ---------- history: the server keeps the transcript per session, so a reload
// (or a restarted server.py) shows the same conversation the engine's KV holds.
async function loadHistory(){
  log.innerHTML = "";
  try{
    const r = await fetch("/api/history?session=" + encodeURIComponent($("sess").value));
    const h = await r.json();
    const msgs = h.messages || [];
    for (const m of msgs){
      if (m.role === "user"){
        const ub = bubble("You", "user");
        const t = m.content || "";
        ub.textContent = t.length > 4000 ? t.slice(0, 4000) + "\n…  (total " + t.length.toLocaleString() + " characters)" : t;
      } else if (m.role === "assistant"){
        assistant().finish(m.reasoning_content || "", m.content || "");
        const s = m.stat;
        if (s) $("s_mode").textContent = decodeModeSummary(s);
        if (s) statline("TTFT " + ((s.ttft_ms||0)/1000).toFixed(1) + " s | Prefill " + (s.prefill_tokens ?? "–")
          + " tok (" + (s.prefill_mode || "–") + ", reused " + (s.reused ?? "–") + ") | Decode " + (s.generated ?? "–")
          + " tok " + (s.tok_s||0).toFixed(2) + " tok/s hit " + (s.hit||0).toFixed(3)
          + " | Disk wait " + (s.stall||0).toFixed(0) + " ms/tok | " + (s.finish || "–") + " | ctx " + (s.context ?? "–")
          + " | " + decodeModeSummary(s));
      }
    }
    if (msgs.length) note("Restored " + msgs.filter(m => m.role === "user").length + " turns");
    if (typeof h.think === "boolean") $("think").checked = h.think;
    const effort = h.reasoning_effort || 75;
    $("effort").value = [50,75,100].includes(effort) ? String(effort) : "custom";
    $("effort_custom").value = effort;
    updateEffort();
  }catch(e){ note("Could not load history: " + e, true); }
  log.scrollTop = log.scrollHeight;
}

// ---------- send ----------
function chatRequest(text, thinking, effort){
  const request = {session:$("sess").value, text,
    temperature:parseFloat($("temp").value), top_p:parseFloat($("topp").value),
    max_tokens:parseInt($("maxtok").value,10), seed:$("seed").value || null,
    think:thinking, reasoning_effort:effort};
  const select = $("decode_mode");
  if (!select.disabled) request.decode_mode = select.value;
  return request;
}
async function send(){
  if (running) return;
  const text = $("box").value;
  if (!text.trim()) return;
  const effort = effortValue();
  if (!Number.isInteger(effort) || effort < 1 || effort > 100){
    note("Reasoning effort must be an integer from 1 to 100", true); return;
  }
  if (lastPreview && lastPreview.over) return;
  if (lastPreview && lastPreview.to_prefill >= 20000 &&
      !confirm("Prefill required: " + lastPreview.to_prefill.toLocaleString()
             + " tokens; estimated " + hms(lastPreview.eta_s) + " . Continue?")) return;

  running = true; $("send").disabled = true; $("stop").hidden = false;
  $("box").value = ""; $("count").textContent = "0 characters"; $("count").className = ""; lastPreview = null;

  const ub = bubble("You", "user");
  ub.textContent = text.length > 4000 ? text.slice(0, 4000) + "\n…  (total " + text.length.toLocaleString() + " characters)" : text;

  let noteEl = null, body = null, t0 = performance.now(), first = null;
  const prog = $("prog"), bar = prog.firstElementChild;
  const perTok = $("hover").checked, thinking = $("think").checked;
  const request = chatRequest(text, thinking, effort);

  abort = new AbortController();
  try{
    const res = await fetch("/api/chat", {method:"POST", signal:abort.signal,
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify(request)});
    if (!res.ok){ const error = await res.json(); throw new Error(error.error || "Request failed"); }
    const rd = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    for(;;){
      const {value, done} = await rd.read();
      if (done) break;
      buf += dec.decode(value, {stream:true});
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0){
        const frame = buf.slice(0, i); buf = buf.slice(i + 2);
        if (!frame.startsWith("data:")) continue;
        const ev = JSON.parse(frame.slice(5).trim());
        const stick = atBottom();

        if (ev.event === "queued"){
          if (!noteEl) noteEl = note("");
          noteEl.textContent = "Queued: " + ev.position + " requests ahead";
          $("s_q").textContent = "Queue " + ev.position;
        }
        else if (ev.event === "start"){
          if (!noteEl) noteEl = note("");
          noteEl.textContent = "Prompt " + ev.prompt_tokens.toLocaleString() + " token, reused "
            + ev.reused.toLocaleString() + ", prefill " + ev.to_prefill.toLocaleString()
            + " tokens; estimated " + hms(ev.eta_s);
          if (ev.to_prefill > 64){ prog.style.display = "block"; bar.style.width = "0%"; }
        }
        else if (ev.event === "prefill"){
          prog.style.display = "block";
          bar.style.width = (100 * ev.done / Math.max(1, ev.total)).toFixed(1) + "%";
          if (noteEl) noteEl.textContent = "Prefill " + ev.done.toLocaleString() + " / "
            + ev.total.toLocaleString() + " tokens · about " + hms(ev.eta_s)
            + " (" + ev.ms_per_token.toFixed(1) + " ms/token)";
          $("s_pf").textContent = ev.ms_per_token.toFixed(1) + " ms/tok";
        }
        else if (ev.event === "token"){
          if (!body){
            prog.style.display = "none";
            if (noteEl){ noteEl.remove(); noteEl = null; }
            body = assistant(thinking, perTok);
            first = performance.now() - t0;
            $("s_ttft").textContent = (first/1000).toFixed(1) + " s";
          }
          body.push(ev.text, ev);
          $("s_tps").textContent = (1000/Math.max(1, ev.step_ms)).toFixed(2) + " tok/s";
          $("s_hit").textContent = ev.hit.toFixed(3);
        }
        else if (ev.event === "done"){
          prog.style.display = "none";
          if (noteEl){ noteEl.remove(); noteEl = null; }
          if (ev.queued_drop){ note("Cancelled before starting"); break; }
          if (!body) body = assistant(thinking, perTok);
          body.finish(ev.reasoning || "", ev.content || "");
          const pt = ev.per_token_ms || {};
          $("s_tps").textContent = (ev.tok_s||0).toFixed(2) + " tok/s";
          $("s_hit").textContent = (ev.decode_hit_rate||0).toFixed(3);
          $("s_stall").textContent = (pt.nvme_stall||0).toFixed(0) + " ms";
          $("s_ttft").textContent = ((ev.ttft_ms||0)/1000).toFixed(1) + " s";
          $("s_ctx").textContent = (ev.context||0).toLocaleString() + " / " + CFG.max_context.toLocaleString();
          $("s_mode").textContent = decodeModeSummary(ev);
          statline("TTFT " + ((ev.ttft_ms||0)/1000).toFixed(1) + " s | Prefill "
            + ev.prefill_tokens + " tok (" + ev.prefill_mode + ", reused " + ev.reused_tokens + ") "
            + (ev.prefill_tok_s||0).toFixed(2) + " tok/s | Decode " + ev.generated + " tok "
            + (ev.tok_s||0).toFixed(2) + " tok/s hit " + (ev.decode_hit_rate||0).toFixed(3)
            + " | Disk wait " + (pt.nvme_stall||0).toFixed(0) + " ms/tok | " + ev.finish
            + " | ctx " + ev.context + " | seed " + ev.seed + " | " + decodeModeSummary(ev));
        }
        else if (ev.event === "error"){
          prog.style.display = "none";
          if (noteEl){ noteEl.remove(); noteEl = null; }
          note("Error: " + ev.message, true);
        }
        if (stick) log.scrollTop = log.scrollHeight;
      }
    }
  }catch(e){
    if (e.name !== "AbortError") note("Connection error: " + e, true);
  }finally{
    if(body) body.finish("", "");
    running = false; abort = null;
    $("send").disabled = false; $("stop").hidden = true;
    $("prog").style.display = "none"; $("s_q").textContent = "";
    refreshStatus();
    if ($("box").value.trim()) schedulePreview();   // a draft typed during the turn
  }
}

// ---------- controls ----------
$("send").onclick = send;
$("stop").onclick = async () => {
  await fetch("/api/cancel", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({session:$("sess").value})});
};
$("newconv").onclick = async () => {
  await fetch("/api/reset", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({session:$("sess").value})});
  log.innerHTML = "";
  $("s_mode").textContent = "–";
  note("Context cleared (expert cache stays warm)");
  refreshStatus();
};
$("box").addEventListener("input", schedulePreview);
$("box").addEventListener("paste", () => setTimeout(schedulePreview, 0));
$("box").addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)){ e.preventDefault(); send(); }
});
$("sess").addEventListener("change", () => { loadHistory(); refreshStatus(); lastPreview = null; schedulePreview(); });
function effortValue(){
  return Number($("effort").value === "custom" ? $("effort_custom").value : $("effort").value);
}
function updateEffort(){
  $("effort").disabled = !$("think").checked;
  $("effort_custom_label").hidden = $("effort").value !== "custom";
  $("effort_custom").disabled = !$("think").checked;
}
$("think").addEventListener("change", () => { updateEffort(); schedulePreview(); });
$("effort").addEventListener("change", () => { updateEffort(); schedulePreview(); });
$("effort_custom").addEventListener("input", schedulePreview);
setInterval(() => { if (!running) refreshStatus(); }, 5000);
loadConfig();
loadHistory();
</script>
</body>
